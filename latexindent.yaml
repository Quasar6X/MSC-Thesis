defaultIndent: '    '

modifyLineBreaks:
  preserveBlankLines: 1
  condenseMultipleBlankLinesInto: 1
  textWrapOptions:
    columns: 120
    when: after
    multipleSpacesToSingle: 1
    removeBlockLineBreaks: 1

indentAfterHeadings:
  section:
    indentAfterThisHeading: 1
    level: 1
  subsection:
    indentAfterThisHeading: 1
    level: 2
  subsubsection:
    indentAfterThisHeading: 1
    level: 3

indentRules:
  chapter: ''
  section: '    '
  subsection: '    '
  subsubsection: '    '
