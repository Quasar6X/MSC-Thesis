name: Build Document

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      force_docker_rebuild:
        type: boolean
        description: Forces docker image rebuild
        default: false
      skip_release:
        type: boolean
        description: Do not create a release from this run
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: thesis-builder

jobs:
  setup:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    outputs:
      changed: ${{ steps.changes.outputs.dockerfile }}
      owner: ${{ steps.lower-owner.outputs.owner }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Detect Dockerfile changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            dockerfile:
              - '.devcontainer/Dockerfile'

      - name: Lowercase OWNER
        id: lower-owner
        run: |
          OWNER=${{ github.repository_owner }};
          echo "owner=${OWNER@L}" >> $GITHUB_OUTPUT

  build-and-push-image:
    runs-on: ubuntu-24.04
    needs: setup
    if: ${{ github.event.inputs.force_docker_rebuild || needs.setup.outputs.changed == 'true' }}

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Log in to Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ needs.setup.outputs.owner }}/${{ env.IMAGE_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          push: true
          file: .devcontainer/Dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.REGISTRY }}/${{ needs.setup.outputs.owner }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  build-latex:
    runs-on: ubuntu-24.04
    needs:
      - setup
      - build-and-push-image

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run latexmk
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/workspace \
            -w /workspace \
            ${{ env.REGISTRY }}/${{ needs.setup.outputs.owner }}/${{ env.IMAGE_NAME }}:latest \
            latexmk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: ${{ ! github.event.inputs.skip_release }}
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.pdf
