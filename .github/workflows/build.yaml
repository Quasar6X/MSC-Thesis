name: Build Document

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

jobs:
  build-latex:
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build \
            -f .devcontainer/Dockerfile \
            -t thesis-builder:ci \
            .

      - name: Run latexmk
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/workspace \
            -w /workspace \
            thesis-builder:ci \
            latexmk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.pdf
